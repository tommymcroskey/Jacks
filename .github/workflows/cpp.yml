name: Risk CI negative probes - DO NOT MERGE

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    name: Windows Debug (${{ matrix.probe }})
    strategy:
      fail-fast: false
      matrix:
        probe: [assertion-failure, empty-selection]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain and source
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --version
          exit $LASTEXITCODE
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Debug --parallel 2
      - name: Test
        if: matrix.probe == 'assertion-failure'
        run: ctest --test-dir build/ci -C Debug --output-on-failure --no-tests=error
      - name: Empty selection must fail
        if: matrix.probe == 'empty-selection'
        run: ctest --test-dir build/ci -C Debug --output-on-failure --no-tests=error -R "^RiskNoSuchHostedProbe$"
